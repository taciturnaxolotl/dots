name: Deploy NixOS Configurations

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  # Decide which nodes from lib/deploy-targets.json need deploying from the diff.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nodes: ${{ steps.set.outputs.nodes }}
      docs: ${{ steps.set.outputs.docs }}
      inputs: ${{ steps.set.outputs.inputs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # machines/<node> deploys that node; shared paths or workflow_dispatch deploy all.
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            shared=1 changed=""
          else
            shared=0
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "${SHA}~1" "$SHA" 2>/dev/null || git ls-files)
            else
              changed=$(git diff --name-only "$BEFORE" "$SHA")
            fi
          fi
          echo "changed files:"; echo "$changed"
          match() { echo "$changed" | grep -qE "$1"; }

          match '^(flake\.nix|flake\.lock)$'          && shared=1
          match '^(modules|lib|secrets|packages)/'     && shared=1
          match '^\.github/workflows/deploy\.yaml$'     && shared=1

          selected=()
          for node in $(jq -r 'keys[]' lib/deploy-targets.json); do
            { [ "$shared" = "1" ] || match "^machines/${node}/"; } && selected+=("$node")
          done
          nodes=$(jq -c 'to_entries | map(select(.key | IN($ARGS.positional[])) | {node: .key, system: .value})' \
            lib/deploy-targets.json --args "${selected[@]}")
          echo "nodes=$nodes" >> "$GITHUB_OUTPUT"

          docs=false
          if [ "$shared" = "1" ] || match '^(docs/|packages/docs\.nix$)'; then docs=true; fi
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

          # Input trees only move when the lock does.
          inputs=false
          if [ "$EVENT" = "workflow_dispatch" ] || match '^flake\.lock$'; then inputs=true; fi
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"

  # Mirror flake input trees onto the tailnet. Their nars are the
  # rarely-requested corner of cache.nixos.org: 300-420 KB/s cold, 26-52 MB/s warm.
  cache-inputs:
    needs: changes
    if: needs.changes.outputs.inputs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:deploy
          use-cache: "true"

      - name: Mirror flake inputs into attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          # Recursive descent picks up transitive inputs too.
          # Without pipefail a failing `nix flake archive` leaves jq reading
          # empty stdin, exiting 0, and the job mirrors nothing but goes green.
          set -euo pipefail
          nix flake archive --json \
            | jq -r '[.path] + [.. | objects | .path? // empty] | unique | .[]' \
            > /tmp/input-paths.txt
          [ -s /tmp/input-paths.txt ] || { echo "no input paths resolved"; exit 1; }
          echo "mirroring $(wc -l < /tmp/input-paths.txt) input paths"

          nix run nixpkgs#attic-client -- login prattle http://prattle:8091 "$ATTIC_TOKEN"
          # attic skips anything upstream has by default, which is exactly these.
          nix run nixpkgs#attic-client -- push \
            --ignore-upstream-cache-filter \
            --stdin dots < /tmp/input-paths.txt

  deploy:
    needs: changes
    if: needs.changes.outputs.nodes != '[]'
    strategy:
      # Legs are isolated: deploy-rs rolls back only the node that failed.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.nodes) }}

    name: ${{ matrix.node }}
    # Build natively on the target's platform.
    runs-on: ${{ fromJSON('{"aarch64-linux":"ubuntu-24.04-arm","x86_64-linux":"ubuntu-latest","aarch64-darwin":"macos-latest"}')[matrix.system] }}
    # Backstop only. deploy-rs' own activationTimeout (240s) and confirmTimeout
    # (30s) do not bound a dead SSH socket: on 2026-08-23 two runs sat in
    # "Waiting for confirmation event..." for over 2h each with those defaults
    # in force. The keepalives below are the tight bound (~1 min); this is set
    # generously so it never kills a legitimately slow cold build, and only
    # exists to beat the 6h GitHub default.
    timeout-minutes: 120
    environment:
      name: ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v6

      # Pull custom packages (knot, herald, …) from prattle's attic cache so the
      # runner substitutes them instead of recompiling. Reachable once Tailscale
      # is up (below), which is before the build in Deploy. Public cache, no token.
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = http://prattle:8091/dots
            extra-trusted-public-keys = dots:Mgol9jjaoUcN6pfgLetO3fe/JAm/fVpKXYBZaQ1MhFM=

      # No runner-store cache: measured a wash. cache-nix-action cut downloads
      # 2459→55 but wall-clock didn't move — restoring a ~4.5 GB GitHub cache
      # costs about what re-fetching from cache.nixos.org's CDN does. The 4-6 min
      # floor is eval + input fetch + copy-to-target + activate, which no runner
      # cache touches. Attic still serves our custom packages to the fleet.
      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:deploy
          use-cache: "true"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config

      # Build on the runner (native arch), then copy only the output-closure
      # diff to the target. Without --remote-build we no longer ship the whole
      # derivation closure to the target over ssh-ng, which was ~24 min to the
      # small VPS. The target substitutes standard paths from cache.nixos.org.
      - name: Deploy ${{ matrix.node }}
        run: |
          # Resolve the toplevel once (eval-cache warm) and stash it so the push
          # step reuses the exact path instead of re-evaluating the flake.
          TOPLEVEL=$(nix eval --raw ".#deploy.nodes.${{ matrix.node }}.profiles.system.path")
          echo "TOPLEVEL=$TOPLEVEL" >> "$GITHUB_ENV"
          nix develop .#default --command deploy \
            --skip-checks \
            --ssh-user kierank \
            --ssh-opts="-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            .#${{ matrix.node }}

      # Best-effort: a cache upload failing says nothing about the deploy.
      - name: Cache build in attic
        continue-on-error: true
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          nix run nixpkgs#attic-client -- login prattle http://prattle:8091 "$ATTIC_TOKEN"
          nix run nixpkgs#attic-client -- push dots "$TOPLEVEL"

  docs:
    needs: [changes, deploy]
    if: always() && needs.deploy.result != 'failure' && (needs.changes.outputs.docs == 'true' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build docs
        run: nix build .#packages.x86_64-linux.docs -L

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy result --project-name=dots-docs
