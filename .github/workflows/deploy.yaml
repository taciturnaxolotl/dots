name: Deploy NixOS Configurations

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Decide which nodes actually need deploying from the diff. A change under
  # machines/<node> deploys only that node; anything shared (flake, modules,
  # lib, secrets, packages, or this workflow) deploys both. workflow_dispatch
  # always deploys everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.set.outputs.nodes }}
      docs: ${{ steps.set.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Classify the diff with plain git: a change under machines/<node>
      # deploys that node; anything shared (flake, modules, lib, secrets,
      # packages, this workflow) deploys both; workflow_dispatch deploys all.
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            shared=1 changed=""
          else
            shared=0
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "${SHA}~1" "$SHA" 2>/dev/null || git ls-files)
            else
              changed=$(git diff --name-only "$BEFORE" "$SHA")
            fi
          fi
          echo "changed files:"; echo "$changed"
          match() { echo "$changed" | grep -qE "$1"; }

          match '^(flake\.nix|flake\.lock)$'          && shared=1
          match '^(modules|lib|secrets|packages)/'     && shared=1
          match '^\.github/workflows/deploy\.yaml$'     && shared=1

          nodes=()
          if [ "$shared" = "1" ]; then
            nodes=(terebithia prattle)
          else
            match '^machines/terebithia/' && nodes+=(terebithia)
            match '^machines/prattle/'    && nodes+=(prattle)
          fi
          if [ ${#nodes[@]} -eq 0 ]; then
            echo "nodes=[]" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${nodes[@]}" | jq -R . | jq -sc . | sed 's/^/nodes=/' >> "$GITHUB_OUTPUT"
          fi

          docs=false
          if [ "$shared" = "1" ] || match '^(docs/|packages/docs\.nix$)'; then docs=true; fi
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  pre-deploy:
    needs: changes
    if: needs.changes.outputs.nodes != '[]'
    runs-on: ubuntu-latest
    outputs:
      generations: ${{ steps.capture.outputs.generations }}

    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:deploy
          use-cache: "true"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config

      - name: Capture generations
        id: capture
        env:
          NODES: ${{ needs.changes.outputs.nodes }}
        run: |
          GENERATIONS='{}'
          for NODE in $(echo "$NODES" | jq -r '.[]'); do
            GEN=$(ssh -n "kierank@${NODE}" \
              "readlink /nix/var/nix/profiles/system | grep -oP 'system-\K[0-9]+'")
            GENERATIONS=$(echo "$GENERATIONS" | jq -c --arg node "$NODE" --arg gen "$GEN" '. + {($node): $gen}')
          done
          echo "generations=$GENERATIONS" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [changes, pre-deploy]
    if: needs.changes.outputs.nodes != '[]'
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.changes.outputs.nodes) }}

    name: ${{ matrix.node }}
    # Build on a runner whose arch matches the target, so the closure builds
    # natively (no emulation) and we can drop --remote-build. terebithia is
    # aarch64; everything else is x86_64.
    runs-on: ${{ matrix.node == 'terebithia' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    environment:
      name: ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:deploy
          use-cache: "true"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config

      # Build on the runner (native arch), then copy only the output-closure
      # diff to the target. Without --remote-build we no longer ship the whole
      # derivation closure to the target over ssh-ng, which was ~24 min to the
      # small VPS. The target substitutes standard paths from cache.nixos.org.
      - name: Deploy ${{ matrix.node }}
        run: |
          nix develop .#default --command deploy \
            --skip-checks \
            --ssh-user kierank \
            --ssh-opts="-o StrictHostKeyChecking=accept-new" \
            .#${{ matrix.node }}

  rollback:
    needs: [pre-deploy, deploy]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:deploy
          use-cache: "true"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config

      - name: Rollback deployed nodes
        env:
          GENERATIONS: ${{ needs.pre-deploy.outputs.generations }}
        run: |
          echo "$GENERATIONS" | jq -r 'to_entries[] | "\(.key) \(.value)"' | \
          while read -r NODE GEN; do
            echo "::group::rollback $NODE → generation $GEN"
            ssh -n "kierank@${NODE}" "
              sudo nix-env -p /nix/var/nix/profiles/system --switch-generation ${GEN}
              sudo /nix/var/nix/profiles/system/bin/switch-to-configuration switch
            "
            echo "::endgroup::"
          done

  docs:
    needs: [changes, deploy]
    if: always() && needs.deploy.result != 'failure' && (needs.changes.outputs.docs == 'true' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build docs
        run: nix build .#packages.x86_64-linux.docs -L

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy result --project-name=dots-docs
